jwt.secret=${JWT_SECRET}


spring.datasource.url=jdbc:postgresql://dev-db:5432/productdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ideatest_dev
spring.datasource.password=${DEV_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=productServicePool

spring.data.redis.host=dev-redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

spring.elasticsearch.uris=http://dev-elasticsearch:9200

spring.rabbitmq.host=dev-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=ideatest_dev
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
