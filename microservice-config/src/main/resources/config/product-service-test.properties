jwt.secret=${JWT_SECRET}


spring.datasource.url=jdbc:postgresql://test-db:5432/productdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ideatest_test
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.pool-name=productServicePool

spring.data.redis.host=test-redis
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

spring.elasticsearch.uris=http://test-elasticsearch:9200

spring.rabbitmq.host=test-rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=ideatest_test
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
